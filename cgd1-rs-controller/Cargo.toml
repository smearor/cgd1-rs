[package]
name = "cgd1-rs-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GTK 4 desktop application for the Qingping CGD1 Bluetooth alarm clock"

[[bin]]
name = "cgd1-controller"
path = "src/main.rs"

[dependencies]
cgd1-rs = { path = "../cgd1-rs" }
clap.workspace = true
gio.workspace = true
glib.workspace = true
gtk4 = { workspace = true, features = ["v4_6"] }
pango = { version = "0.22", features = ["v1_56"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["btleplug"]
btleplug = []
