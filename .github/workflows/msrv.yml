name: MSRV
run-name: Minimum Supported Rust Version for ${{ github.ref == 'refs/heads/main' && 'Nightly' || github.event_name == 'pull_request' && format('{0} {1}', 'Pull Request', github.event.pull_request.number) || format('{0} {1}', 'Branch', github.ref) }} by @${{ github.actor }}

on:
  push:
    branches: [ main ]
    paths:
      - "cgd1-rs*/src/**/*.rs"
      - "cgd1-rs*/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/msrv.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "cgd1-rs*/src/**/*.rs"
      - "cgd1-rs*/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/msrv.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: VCS Checkout
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install cargo msrv
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-msrv@0.19.3
      - name: Version of cargo msrv
        run: cargo msrv --version
      - name: Verify MSRV cgd1-rs
        run: cargo msrv --output-format json verify --path cgd1-rs
      - name: Verify MSRV cgd1-rs-cli
        run: cargo msrv --output-format json verify --path cgd1-rs-cli
      - name: Verify MSRV cgd1-rs-ws
        run: cargo msrv --output-format json verify --path cgd1-rs-ws
      - name: Find MSRV on verify failure
        if: ${{ failure() }}
        run: |
          cargo msrv find --output-format json --path cgd1-rs || true
          cargo msrv find --output-format json --path cgd1-rs-cli || true
          cargo msrv find --output-format json --path cgd1-rs-ws || true
